name: Verify Azure login

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: choice
        options:
          - dev
          - prod
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Login to Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure identity
        run: |
          az account show \
            --query "{Subscription:name,IdentityType:user.type,Identity:user.name}" \
            --output table